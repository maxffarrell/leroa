# Hostinger VPS deployment candidate. See docs/deploy-hostinger.md for validation status.
# Set POSTGRES_PASSWORD, BETTER_AUTH_SECRET and APP_DOMAIN in the project environment.
services:
  proxy:
    image: caddy:2-alpine
    command:
      [
        'caddy',
        'reverse-proxy',
        '--from',
        '${APP_DOMAIN:?set the public DNS hostname}',
        '--to',
        'app:3000'
      ]
    ports: ['80:80', '443:443']
    volumes: ['caddy_data:/data', 'caddy_config:/config']
    depends_on: [app]
    restart: unless-stopped
  app:
    # A raw Compose download has no local checkout. Build this reviewed revision.
    build: https://github.com/maxffarrell/leroa.git#6cd5d940a43691b38540ea031099927d4aade465
    pull_policy: build
    environment:
      DATABASE_URL: postgres://leroa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/leroa
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ORIGIN: https://${APP_DOMAIN:?set the public DNS hostname}
      LEROA_ENTERPRISE_KEY: ${LEROA_ENTERPRISE_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: leroa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: leroa
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leroa']
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
  pgdata:
