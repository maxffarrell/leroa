<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Leroa — offline</title>
		<style>
			body {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				display: grid;
				place-items: center;
				min-height: 100vh;
				margin: 0;
				background: #fafafa;
				color: #171717;
			}
			.card {
				text-align: center;
				padding: 2rem;
			}
			h1 {
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				color: #737373;
				font-size: 0.875rem;
			}
			button {
				margin-top: 1rem;
				padding: 0.5rem 1rem;
				border: 1px solid #d4d4d4;
				border-radius: 0.5rem;
				background: #fff;
				font-size: 0.875rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img src="/icons/icon-192.png" width="64" height="64" alt="Leroa" />
			<h1>You're offline</h1>
			<p>Leroa needs a connection to reach your workspace.<br />Check your network and try again.</p>
			<button onclick="location.reload()">Retry</button>
		</div>
	</body>
</html>
