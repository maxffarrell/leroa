# Set persistent BETTER_AUTH_SECRET and POSTGRES_PASSWORD in .env before starting.
# Generate a URL-safe hex DB password with `openssl rand -hex 32`.
services:
  app:
    image: leroa:local
    build: .
    pull_policy: build
    env_file:
      - path: .env
        required: false
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://leroa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/leroa
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      LEROA_ENTERPRISE_KEY: ${LEROA_ENTERPRISE_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: leroa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: leroa
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leroa']
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
