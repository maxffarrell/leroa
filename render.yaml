# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/maxffarrell/leroa
services:
  - type: web
    name: leroa
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leroa-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true

databases:
  - name: leroa-db
    plan: free
    postgresMajorVersion: '18'
